[paths]
extensions_dirs = ["extensions"]

[build]
skip_base_generation =true
extensions = ["standard-port", "dot-port", "dot-client", "container-mode"]

[build.combos]
"standard-dns" = ["standard-port", "dot-client"]
"container-dns" = ["container-mode", "dot-client"]
"dot-dns" = ["dot-port", "dot-client"]

[build.environments]
available = ["standard-node", "dot-node", "container-node"]

[build.environments.standard-node]
combos = ["standard-dns"]

[build.environments.dot-node]
combos = ["dot-dns"]

[build.environments.container-node]
combos = ["container-dns"]
